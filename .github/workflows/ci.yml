name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 1. Contrôle de code (Linter) : s'arrête en cas d'erreur de syntaxe ou de style
      - name: Code Quality Check (Flake8)
        run: |
          # Arrête le pipeline si des erreurs de syntaxe Python ou de variables non définies existent
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements de style (pep8)
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 2. Exécution des tests unitaires
      - name: Run tests
        run: python -m pytest -v

  docker-build:
    needs: lint-and-test # S'exécute uniquement si le contrôle de code et les tests réussissent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3. Build et vérification de l'image Docker en cas d'erreur de construction
      - name: Build Docker Image
        run: |
          docker build -t devops-tp1:${{ github.sha }} .

      # 4. Vérification optionnelle de l'exécution du conteneur
      - name: Test Docker Container
        run: |
          docker run -d -p 5001:5001 --name test-container devops-tp1:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5001/ || exit 1